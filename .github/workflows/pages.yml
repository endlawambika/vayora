name: Deploy to GitHub Pages
# Optional. Only needed if you keep the editable source in your repository and want GitHub to
# build it. If you upload the ready-made site files instead, use "Deploy from a branch".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the site (uses siteUrl from src/site.json, e.g. https://yourdomain.com)
        run: node build.mjs
      - name: Check links
        run: node scripts/check-links.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
