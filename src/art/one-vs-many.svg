<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ovm-title">
  <title id="ovm-title">Comparison: four separate devices (a fan, an air purifier, a mini cooler and a plug-in mosquito repellent) next to one Vayora device that combines cooling, purification, humidity management and active mosquito capture in a rechargeable unit.</title>
