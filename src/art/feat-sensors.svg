<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fs-title">
  <title id="fs-title">Diagram of Vayora's display panel showing example readings: 26 degrees Celsius, 52 percent relative humidity and the current comfort mode, with a power button. Beside it: temperature, humidity and comfort-mode readouts.</title>
  <defs>
    <linearGradient id="fs-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11305A"/><stop offset="1" stop-color="#0A2E4D"/></linearGradient>
    <linearGradient id="fs-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12C2B6"/><stop offset="1" stop-color="#0A6FC2"/></linearGradient>
  </defs>
  <rect x="40" y="24" width="190" height="272" rx="26" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="58" y="42" width="154" height="236" rx="18" fill="url(#fs-glass)" stroke="url(#fs-edge)" stroke-width="2.5"/>
  <text x="135" y="118" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFFFFF">26<tspan font-size="20" dy="-20">°C</tspan></text>
  <text x="135" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#A6EFE8">52% RH</text>
  <text x="135" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#A6EFE8">Mode: Cool</text>
  <circle cx="135" cy="240" r="15" fill="none" stroke="#6FE3D9" stroke-width="2.4"/>
  <path d="M135 228 V 240 M127 233 A 11 11 0 1 0 143 233" fill="none" stroke="#6FE3D9" stroke-width="2.4" stroke-linecap="round"/>
  <g font-family="Inter, sans-serif">
    <rect x="270" y="56" width="180" height="58" rx="14" fill="#FFFFFF" stroke="#DCE4EC"/>
    <circle cx="294" cy="85" r="12" fill="#E2F8F6"/><path d="M294 77 v 10 m -4 0 a 4 4 0 1 0 8 0" stroke="#0B7A73" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="314" y="79" font-size="12" fill="#4A5667">Temperature</text><text x="314" y="99" font-size="15" font-weight="700" fill="#0D426D">Room reading</text>
    <rect x="270" y="130" width="180" height="58" rx="14" fill="#FFFFFF" stroke="#DCE4EC"/>
    <circle cx="294" cy="159" r="12" fill="#E2F8F6"/><path d="M294 151 q 6 7 0 13 q -6 -6 0 -13z" fill="#0B7A73"/>
    <text x="314" y="153" font-size="12" fill="#4A5667">Humidity</text><text x="314" y="173" font-size="15" font-weight="700" fill="#0D426D">Relative %</text>
    <rect x="270" y="204" width="180" height="58" rx="14" fill="#FFFFFF" stroke="#DCE4EC"/>
    <circle cx="294" cy="233" r="12" fill="#E5F2FC"/><path d="M287 233 h 8 a 3 3 0 1 0 -3 -3 M287 238 h 12 a 3 3 0 1 1 -3 3" stroke="#0A6FC2" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="314" y="227" font-size="12" fill="#4A5667">Comfort mode</text><text x="314" y="247" font-size="15" font-weight="700" fill="#0D426D">Cool or airflow only</text>
  </g>
  <text x="135" y="314" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#4A5667">Example readings</text>
</svg>
