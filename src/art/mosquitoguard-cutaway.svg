12" fill="#fff">2</text><text x="350" y="489" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#0D426D">UV-A attraction light</text><text x="350" y="504" font-family="Inter, sans-serif" font-size="11" fill="#4A5667">Low-power LED beside the intake</text><circle cx="616" cy="490" r="11" fill="#0D426D"/><text x="616" y="494.5" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#fff">3</text><text x="636" y="489" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#0D426D">Scent lure cartridge</text><text x="636" y="504" font-family="Inter, sans-serif" font-size="11" fill="#4A5667">Replaceable, in the side compartment</text><circle cx="44" cy="526" r="11" fill="#0D426D"/><text x="44" y="530.5" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#fff">4</text><text x="64" y="525" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#0D426D">One-way funnel</text><text x="64" y="540" font-family="Inter, sans-serif" font-size="11" fill="#4A5667">Wide mouth, narrow exit to the chamber</text><circle cx="330" cy="526" r="11" fill="#0D426D"/><text x="330" y="530.5" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#fff">5</text><text x="350" y="525" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#0D426D">Removable mesh collection chamber</text><text x="350" y="540" font-family="Inter, sans-serif" font-size="11" fill="#4A5667">Slides out of the side for emptying</text><circle cx="616" cy="526" r="11" fill="#0D426D"/><text x="616" y="530.5" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#fff">6</text><text x="636" y="525" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#0D426D">Dedicated suction fan</text><text x="636" y="540" font-family="Inter, sans-serif" font-size="11" fill="#4A5667">Low-power, separate from the cooling fan</text><g font-family="Inter, sans-serif" font-size="11.5" fill="#4A5667"><text x="20" y="40" font-weight="700" fill="#0D426D">Mosquito path: attracted to the side intake</text><text x="420" y="40" font-weight="700" fill="#64748B">Suction airflow: through the mesh, out of the exhaust</text><text x="690" y="446" font-weight="600">Exhaust air out</text><text transform="translate(754 270) rotate(-90)" text-anchor="middle" font-weight="600" font-size="10.5" fill="#334155">Sealed partition</text><text x="836" y="402" text-anchor="middle" font-weight="700" fill="#0A6FC2">Main cooling</text><text x="836" y="416" text-anchor="middle" font-weight="700" fill="#0A6FC2">airflow, kept</text><text x="836" y="430" text-anchor="middle" font-weight="700" fill="#0A6FC2">separate</text><text x="64" y="336" text-anchor="middle" font-weight="600">Outside</text></g>
