<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mg-title">
  <title id="mg-title">Section view of the Vayora MosquitoGuard side module. Mosquitoes outside are drawn towards the side intake grille by a UV-A light and a scent lure cartridge. Inside, a one-way funnel narrows towards a removable mesh collection chamber. A dedicated low-power suction fan behind the chamber pulls air through the mesh and out of an exhaust vent, so mosquitoes stay in the chamber. A sealed partition keeps this airflow separate from the main cooling and purification airflow.</title>
