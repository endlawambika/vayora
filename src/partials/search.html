<dialog class="search-dialog" id="search" aria-labelledby="search-title" data-search>
    <div class="search-panel">
      <h2 id="search-title" class="visually-hidden">Search the Vayora site</h2>
      <div class="search-field">
        {{icon:search}}
        <label for="site-search" class="visually-hidden">Search features, uses, FAQs and pricing</label>
        <input id="site-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search features, uses, FAQs and pricing" aria-describedby="search-hint" aria-controls="search-results" data-search-input autofocus>
        <button class="search-close" type="button" aria-label="Close search" data-search-close>{{icon:x}}</button>
      </div>
      <div class="search-body">
        <div class="search-suggest" data-search-suggest>
          <p class="search-label">Popular searches</p>
          <div class="search-chips">
            <button type="button" data-search-term="cooling">Cooling</button>
            <button type="button" data-search-term="purification">Purification</button>
            <button type="button" data-search-term="humidity">Humidity</button>
            <button type="button" data-search-term="mosquitoguard">MosquitoGuard</button>
            <button type="button" data-search-term="battery">Battery</button>
            <button type="button" data-search-term="travel">Travel</button>
            <button type="button" data-search-term="outdoor">Outdoor</button>
            <button type="button" data-search-term="price">Price</button>
          </div>
        </div>
        <p class="search-label" data-search-count hidden></p>
        <ul class="search-results" id="search-results" data-search-results></ul>
        <p class="search-empty" data-search-empty hidden></p>
      </div>
      <p class="search-hint" id="search-hint">Tip: press <kbd>/</kbd> on any page to search. Use <kbd>↑</kbd> <kbd>↓</kbd> to move and <kbd>Enter</kbd> to open.</p>
    </div>
  </dialog>
