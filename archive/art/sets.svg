<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sets-title">
  <title id="sets-title">Nested sets: from all options a consumer is aware of, to the evoked set they would seriously consider, to the final choice. Vayora's goal is to enter the evoked set.</title>
  <ellipse cx="320" cy="110" rx="300" ry="100" fill="#F3F9F9" stroke="#D3D9DF" stroke-width="2"/>
  <ellipse cx="360" cy="110" rx="214" ry="76" fill="#E0F4F3" stroke="#91D7D2" stroke-width="2"/>
  <ellipse cx="478" cy="110" rx="78" ry="42" fill="#112645"/>
  <g font-family="Inter, sans-serif" font-size="13" font-weight="600">
    <text x="34" y="104" fill="#425E5C">Awareness set</text>
    <text x="34" y="122" fill="#425E5C" font-weight="400" font-size="11.5">fans, nets, purifiers</text>
    <text x="176" y="104" fill="#112645">Evoked set</text>
    <text x="176" y="122" fill="#1B3761" font-weight="400" font-size="11.5">options seriously</text><text x="176" y="138" fill="#1B3761" font-weight="400" font-size="11.5">considered</text>
    <text x="478" y="106" text-anchor="middle" fill="#FFFFFF">Choice</text>
    <text x="478" y="124" text-anchor="middle" fill="#C1EDEA" font-weight="400" font-size="11.5">Vayora's goal</text>
  </g>
</svg>
