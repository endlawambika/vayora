<svg viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-title">
  <title id="pr-title">Close-up render of Vayora: a slim, rounded portrait unit with a recessed carry handle, a circular temperature and humidity display, vertical air vents and a status light.</title>
  <defs>
    <linearGradient id="pr-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F3F6F8"/><stop offset="1" stop-color="#E0E5EB"/>
    </linearGradient>
    <linearGradient id="pr-side" gradientUnits="userSpaceOnUse" x1="0" y1="62" x2="0" y2="488">
      <stop offset="0" stop-color="#E7ECF1"/><stop offset=".25" stop-color="#C6CED7"/><stop offset="1" stop-color="#A4B0BC"/>
    </linearGradient>
    <linearGradient id="pr-top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F3F6"/><stop offset="1" stop-color="#DBE1E7"/>
    </linearGradient>
    <linearGradient id="pr-vent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E7973"/><stop offset="1" stop-color="#112645"/>
    </linearGradient>
    <radialGradient id="pr-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0C1C34" stop-opacity=".38"/><stop offset="1" stop-color="#0C1C34" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pr-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#71C8C2" stop-opacity=".55"/><stop offset="1" stop-color="#71C8C2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="282" cy="502" rx="170" ry="22" fill="url(#pr-shadow)"/>

  <!-- airflow leaving the vents -->
  <g fill="none" stroke-linecap="round">
    <path class="flow-line slow" d="M168 330 C 120 320 86 290 30 300" stroke="#71C8C2" stroke-width="3"/>
    <path class="flow-line slow d1" d="M168 380 C 116 384 76 372 20 388" stroke="#71C8C2" stroke-width="3"/>
    <path class="flow-line slow d2" d="M168 430 C 120 446 84 470 34 466" stroke="#71C8C2" stroke-width="3"/>
  </g>

  <!-- body: stacked offsets form a solid rounded extrusion; back edge carries the window-seal gasket -->
  <g><rect x="216.0" y="62.0" width="168" height="400" rx="40" fill="url(#pr-side)" stroke="#71C8C2" stroke-width="3"/><rect x="213.1" y="63.6" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="210.2" y="65.2" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="207.4" y="66.9" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="204.5" y="68.5" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="201.6" y="70.1" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="198.8" y="71.8" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="195.9" y="73.4" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="193.0" y="75.0" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="190.1" y="76.6" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="187.2" y="78.2" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="184.4" y="79.9" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="181.5" y="81.5" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="178.6" y="83.1" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="175.8" y="84.8" width="168" height="400" rx="40" fill="url(#pr-side)"/><rect x="172.9" y="86.4" width="168" height="400" rx="40" fill="url(#pr-side)"/></g>
  <rect x="170" y="88" width="168" height="400" rx="40" fill="url(#pr-front)"/>
  <rect x="170" y="88" width="168" height="400" rx="40" fill="none" stroke="#CFD6DE" stroke-width="1.4"/>

  <!-- recessed carry handle -->
  <rect x="216" y="104" width="76" height="14" rx="7" fill="#DAE0E6"/>
  <rect x="216" y="104" width="76" height="5" rx="2.5" fill="#C3CCD4"/>

  <!-- display -->
  <circle cx="254" cy="192" r="50" fill="url(#pr-glow)"/>
  <circle cx="254" cy="192" r="44" fill="#112645"/>
  <circle cx="254" cy="192" r="37" fill="none" stroke="#1E7973" stroke-width="4"/>
  <circle cx="254" cy="192" r="37" fill="none" stroke="#71C8C2" stroke-width="4" stroke-linecap="round" stroke-dasharray="150 90" transform="rotate(-210 254 192)"/>
  <text x="254" y="194" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">24°C</text>
  <text x="254" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#91D1CD">58% RH</text>

  <!-- touch controls -->
  <g fill="#EDF0F3" stroke="#C6CED7" stroke-width="1.2">
    <circle cx="222" cy="262" r="11"/><circle cx="254" cy="262" r="11"/><circle cx="286" cy="262" r="11"/>
  </g>
  <g fill="none" stroke="#112645" stroke-width="1.7" stroke-linecap="round">
    <path d="M218.5 258.5 A 5 5 0 1 0 225.5 258.5"/><line x1="222" y1="255.5" x2="222" y2="261"/>
    <path d="M249 262 c 2-3 4 3 6 0 s 3-3 4 0" />
    <path d="M281 265 l 5-6 l 5 6"/>
  </g>

  <!-- vents -->
  <g fill="url(#pr-vent)">
    <rect x="196" y="298" width="8" height="150" rx="4"/><rect x="211" y="298" width="8" height="150" rx="4"/><rect x="226" y="298" width="8" height="150" rx="4"/>
    <rect x="241" y="298" width="8" height="150" rx="4"/><rect x="256" y="298" width="8" height="150" rx="4"/><rect x="271" y="298" width="8" height="150" rx="4"/>
    <rect x="286" y="298" width="8" height="150" rx="4"/><rect x="301" y="298" width="8" height="150" rx="4"/>
  </g>

  <!-- status light + wordmark -->
  <circle class="pulse" cx="254" cy="466" r="3.6" fill="#71C8C2"/>
  <text x="362" y="404" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#719895" transform="rotate(-90 362 404)" letter-spacing="1">Vayora</text>

  <!-- USB-C port on the side -->
  <rect x="368" y="420" width="6" height="18" rx="3" fill="#739A97"/>
</svg>
