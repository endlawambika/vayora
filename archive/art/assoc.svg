<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="as-title">
  <title id="as-title">Brand association map: Vayora at the centre, linked to forest green, the tagline, the pod silhouette, the airflow line and the filter-stack illustration.</title>
  <g stroke="#71C8C2" stroke-width="2">
    <line x1="200" y1="150" x2="80" y2="60"/><line x1="200" y1="150" x2="320" y2="60"/><line x1="200" y1="150" x2="70" y2="220"/>
    <line x1="200" y1="150" x2="330" y2="220"/><line x1="200" y1="150" x2="200" y2="268"/>
  </g>
  <circle cx="200" cy="150" r="48" fill="#112645"/>
  <text x="200" y="155" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Vayora</text>
  <g font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#112645">
    <rect x="10" y="40" width="140" height="40" rx="20" fill="#FFFFFF" stroke="#D3D9DF"/><circle cx="32" cy="60" r="9" fill="#112645"/><text x="92" y="64">Forest green</text>
    <rect x="252" y="40" width="136" height="40" rx="20" fill="#FFFFFF" stroke="#D3D9DF"/><text x="320" y="56">“Breathe Better.</text><text x="320" y="71">Live Freely.”</text>
    <rect x="2" y="200" width="144" height="40" rx="20" fill="#FFFFFF" stroke="#D3D9DF"/><rect x="16" y="208" width="13" height="24" rx="5" fill="#C1EDEA" stroke="#112645"/><text x="90" y="224">Pod silhouette</text>
    <rect x="270" y="200" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#D3D9DF"/><path d="M284 220 c 6 -6 10 6 16 0" stroke="#112645" stroke-width="2" fill="none"/><text x="342" y="224">Airflow line</text>
    <rect x="132" y="250" width="136" height="40" rx="20" fill="#FFFFFF" stroke="#D3D9DF"/><text x="200" y="274">Filter-stack visual</text>
  </g>
</svg>
