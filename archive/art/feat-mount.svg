  <rect x="40" y="40" width="200" height="240" fill="#E1E6EC" stroke="#FFFFFF" stroke-width="6"/>
  <rect x="190" y="40" width="130" height="240" fill="#EBF4F3" stroke="#FFFFFF" stroke-width="6"/>
  <rect x="186" y="40" width="4" height="240" fill="#C6CED7"/>
  <rect x="326" y="42" width="114" height="112" rx="4" fill="#FFFFFF" stroke="#71C8C2" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="326" y="152" width="114" height="128" rx="20" fill="#FFFFFF" stroke="#112645" stroke-width="2"/>
  <circle cx="383" cy="182" r="12" fill="#112645"/>
  <g fill="#193359"><rect x="360" y="204" width="6" height="58" rx="3"/><rect x="372" y="204" width="6" height="58" rx="3"/><rect x="384" y="204" width="6" height="58" rx="3"/><rect x="396" y="204" width="6" height="58" rx="3"/></g>
