    <rect x="204" y="96" width="114" height="26" rx="13" fill="#112645"/><text x="261" y="113" text-anchor="middle" fill="#C1EDEA">Adjustable panel</text>
    <line x1="300" y1="239" x2="326" y2="239" stroke="#112645" stroke-width="2"/><rect x="204" y="226" width="96" height="26" rx="13" fill="#FFFFFF"/><text x="252" y="243" text-anchor="middle">Vayora</text>
