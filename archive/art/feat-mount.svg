<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fm-title">
  <title id="fm-title">Diagram of the proposed tool-free window fit: Vayora sits in the gap of a sliding window, and an adjustable filler panel extends to close the remaining opening.</title>
