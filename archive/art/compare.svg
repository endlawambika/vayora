<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmp-title">
  <title id="cmp-title">Side-by-side illustration. Left: a conventional indoor air purifier in a closed room, cleaning and recirculating the air already inside. Right: Vayora in a window, drawing outdoor air in, filtering and cooling it, while particles and insects are held back outside.</title>
  <defs>
    <marker id="cmp-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#425E5C"/></marker>
    <marker id="cmp-ah2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#112645"/></marker>
  </defs>
  <!-- LEFT: conventional purifier -->
  <g>
    <rect x="20" y="40" width="340" height="250" rx="16" fill="#EEF1F4"/>
    <rect x="20" y="40" width="340" height="250" rx="16" fill="none" stroke="#C6CED5" stroke-width="2"/>
    <rect x="34" y="88" width="10" height="100" fill="#D0D6DC"/>
    <line x1="34" y1="138" x2="44" y2="138" stroke="#ABB3BB" stroke-width="2"/>
    <rect x="236" y="150" width="64" height="124" rx="14" fill="#FFFFFF" stroke="#C6CED5" stroke-width="1.5"/>
    <g fill="#ABB3BB"><rect x="248" y="166" width="40" height="5" rx="2.5"/><rect x="248" y="176" width="40" height="5" rx="2.5"/><rect x="248" y="186" width="40" height="5" rx="2.5"/></g>
    <circle cx="268" cy="240" r="12" fill="none" stroke="#ABB3BB" stroke-width="2"/>
    <g fill="none" stroke="#425E5C" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 8">
      <path class="flow-line slow" d="M240 160 C 180 110 100 110 90 170 C 84 220 150 260 228 236" marker-end="url(#cmp-ah)"/>
      <path class="flow-line slow d1" d="M262 146 C 230 80 140 70 110 92" marker-end="url(#cmp-ah)"/>
    </g>
    <text x="190" y="322" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="16" fill="#11223C">Conventional indoor purifier</text>
    <text x="190" y="344" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#425E5C">Cleans and recirculates the air already inside</text>
  </g>
  <!-- RIGHT: Vayora -->
  <g>
    <rect x="420" y="40" width="340" height="250" rx="16" fill="#E0F4F3"/>
    <rect x="420" y="40" width="340" height="250" rx="16" fill="none" stroke="#91D7D2" stroke-width="2"/>
    <rect x="414" y="96" width="14" height="128" fill="#FFFFFF" stroke="#B8DDDB"/>
    <rect x="412" y="152" width="22" height="56" rx="7" fill="#112645"/>
    <g fill="#8A95A0"><circle cx="388" cy="120" r="2.6"/><circle cx="398" cy="166" r="2.2"/><circle cx="384" cy="196" r="3"/><circle cx="402" cy="226" r="2"/><circle cx="392" cy="146" r="1.8"/></g>
    <g transform="translate(396 86)" stroke="#425E5C" stroke-width="1.3" fill="none" stroke-linecap="round"><ellipse rx="4.5" ry="2" fill="#425E5C"/><path d="M-1 -1 Q -6 -10 -2 -11 M1 -1 Q 5 -10 7 -8 M-3 1 l -3 5 M3 1 l 3 5"/></g>
    <text x="392" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#425E5C">outside</text>
    <g fill="none" stroke="#112645" stroke-width="2.6" stroke-linecap="round">
      <path class="flow-line" d="M438 168 C 520 150 600 120 700 128" marker-end="url(#cmp-ah2)"/>
      <path class="flow-line d1" d="M438 182 C 540 186 620 190 720 184" marker-end="url(#cmp-ah2)"/>
      <path class="flow-line d2" d="M438 196 C 520 220 600 250 700 244" marker-end="url(#cmp-ah2)"/>
    </g>
    <text x="590" y="322" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="16" fill="#112645">Vayora</text>
    <text x="590" y="344" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1B3761">Brings outdoor air in, filters and cools it</text>
  </g>
  <text x="390" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#425E5C">Illustrative concept, not to scale or a performance test</text>
</svg>
